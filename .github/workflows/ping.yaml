name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request with Cookie Support
        run: |
          TARGET_URL="https://mathcanvas.streamlit.app"
          echo "Initiating ping to: $TARGET_URL"
          
          # -c /tmp/cookies.txt saves cookies received from Streamlit
          # -b /tmp/cookies.txt sends those cookies back on redirects
          # --max-redirs 5 stops any runaway loop safely
          # --max-time 30 times out after 30 seconds if the server hangs
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -c /tmp/cookies.txt \
            -b /tmp/cookies.txt \
            --max-redirs 5 \
            --max-time 30 \
            -L "$TARGET_URL" || echo "000")
          
          echo "Response HTTP Status Code: $HTTP_STATUS"
          
          # Always exit with 0 so the cron job doesn't fail on temporary cold starts
          exit 0
