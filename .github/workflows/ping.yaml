name: Keep Streamlit App Alive

# Defines when this workflow will run
on:
  schedule:
    # Runs every 5 minutes (Note: GitHub's minimum cron frequency is 5 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to manually trigger the ping from the GitHub Actions tab

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send HTTP Request to Streamlit
        run: |
          TARGET_URL="https://mathcanvas.streamlit.app"
          echo "Initiating ping to: $TARGET_URL"
          
          # Send a curl request:
          # -s: Silent mode (suppresses progress meter)
          # -o /dev/null: Discards the response body
          # -w "%{http_code}": Outputs only the HTTP status code at the end
          # --max-time 30: Times out after 30 seconds if the server hangs
          # -L: Follows redirects automatically
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$TARGET_URL")
          
          echo "Response HTTP Status Code: $HTTP_STATUS"
          
          # Evaluate the status code
          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 400 ]]; then
            echo "Success: App is awake and responding (Status $HTTP_STATUS)."
            exit 0
          else
            echo "Notice: App returned status code $HTTP_STATUS. It might still be starting up or sleeping."
            # Exiting with 0 prevents GitHub from marking the action as a "failure" 
            # due to a temporary cold-start hiccup.
            exit 0
          fi
